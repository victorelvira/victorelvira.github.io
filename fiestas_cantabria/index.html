<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiestas de pueblo de Cantabria</title>
  <meta name="description" content="Mapa interactivo y calendario de las fiestas de pueblo de Cantabria: fechas, tipos y programas.">

  <!-- Leaflet (mapa) desde CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-mark">🎉</span>
      <div>
        <h1>Fiestas de pueblo de Cantabria</h1>
        <p class="subtitle">Mapa interactivo · fechas · tipos de fiesta</p>
      </div>
    </div>
    <div class="header-right">
      <div class="header-count"><span id="contador">0</span> fiestas</div>
      <div class="update-info" id="update-info"></div>
    </div>
  </header>

  <div class="vista-toggle">
    <button type="button" data-vista="lista" class="vista-activa">📋 Lista</button>
    <button type="button" data-vista="mapa">🗺️ Mapa</button>
  </div>

  <div class="app-body">
    <!-- Panel lateral -->
    <aside class="sidebar">
      <div class="filters">
        <input type="search" id="buscar" placeholder="Buscar fiesta o pueblo…" autocomplete="off">
        <div class="fechas">
          <label>Desde <input type="date" id="desde"></label>
          <label>Hasta <input type="date" id="hasta"></label>
        </div>
        <div class="chips">
          <button type="button" class="chip" data-rango="hoy">Hoy</button>
          <button type="button" class="chip" data-rango="finde">Este finde</button>
          <button type="button" class="chip" data-rango="mes">Este mes</button>
          <button type="button" class="chip" data-rango="todas">Todas</button>
        </div>
        <div class="filter-row">
          <select id="orden">
            <option value="cortas">Fiestas más cortas</option>
            <option value="inicio">Por fecha de inicio</option>
            <option value="fin">Por fecha de fin</option>
          </select>
          <select id="filtro-tipo">
            <option value="">Todos los tipos</option>
            <option value="carnaval">Carnaval</option>
            <option value="romeria">Romería</option>
            <option value="gastronomica">Gastronómica</option>
            <option value="historica">Histórica</option>
            <option value="floral">Floral</option>
            <option value="religiosa">Religiosa</option>
            <option value="patronal">Patronal</option>
          </select>
        </div>
        <label class="chk"><input type="checkbox" id="filtro-mapa" checked> Solo las de la zona visible del mapa</label>
      </div>
      <ul id="lista" class="lista"></ul>
    </aside>

    <!-- Mapa -->
    <main class="map-wrap">
      <div id="map"></div>
    </main>
  </div>

  <!-- Panel de detalle -->
  <div id="detalle" class="detalle" hidden>
    <button id="cerrar-detalle" class="cerrar" aria-label="Cerrar">✕</button>
    <div id="detalle-contenido"></div>
  </div>
  <div id="overlay" class="overlay" hidden></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
