<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The atlas in numbers · Interactive Atlas of Painting</title>
<meta name="description" content="What the Atlas of Painting is made of: where the art is and where it was made, how much of a painter lives in one building, and how complete each painter is.">
<meta property="og:type" content="website">
<meta property="og:title" content="The atlas in numbers">
<meta property="og:description" content="Where the art is and where it was made — and how complete the atlas is, painter by painter.">
<meta property="og:image" content="https://victorelvira.github.io/projects/artatlas/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
<style>
  :root{--bg:#f6f3ee;--paper:#fff;--ink:#241a12;--muted:#736a60;--line:#e5e0d6;--accent:#7a4a2b;
        --bar:#b08a52;--bar2:#7d9b8f;--serif:Georgia,"Iowan Old Style","Times New Roman",serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--serif)}
  header{background:var(--paper);border-top:3px solid var(--accent);border-bottom:1px solid var(--line);
         padding:14px 20px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  header h1{font-size:21px;margin:0;font-weight:600;letter-spacing:-.3px}
  header .sub{color:var(--muted);font-size:13px}
  header nav{margin-left:auto;display:flex;gap:10px;align-items:center}
  header a{color:var(--accent);font-size:14px}
  .langs{display:flex;gap:2px}
  .langs button{font:inherit;font-size:12px;border:1px solid var(--line);background:#faf8f4;
                color:var(--muted);padding:3px 8px;border-radius:4px;cursor:pointer}
  .langs button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{max-width:1000px;margin:0 auto;padding:22px 20px 60px}
  .note{background:#fbf6ec;border:1px solid #e8dcc4;border-left:3px solid var(--bar);
        padding:12px 15px;border-radius:5px;font-size:14.5px;line-height:1.65;margin:0 0 26px}
  h2{font-size:19px;margin:34px 0 4px;font-weight:600}
  h2 + p.lede{margin:0 0 14px;color:var(--muted);font-size:14px;line-height:1.55}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:14px 0 0}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:11px 13px}
  .card b{display:block;font-size:23px;line-height:1.15;font-weight:600}
  .card span{font-size:12px;color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--paper);border:1px solid var(--line);
        border-radius:6px;overflow:hidden;font-size:14.5px}
  th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--line)}
  th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar{position:relative;display:block;height:16px;background:#efe9dd;border-radius:3px;min-width:40px}
  .bar i{position:absolute;inset:0 auto 0 0;background:var(--bar);border-radius:3px}
  .bar.alt i{background:var(--bar2)}
  .bar em{position:absolute;right:5px;top:-1px;font:11px/18px system-ui,sans-serif;color:#4a3d31;font-style:normal}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .ratio{font-variant-numeric:tabular-nums}
  .ratio.low{color:#9c4a2f}.ratio.high{color:#4a6a8f}
  footer{border-top:1px solid var(--line);background:var(--paper);padding:14px 20px;
         color:var(--muted);font-size:12.5px;text-align:center}
  @media(max-width:700px){.split{grid-template-columns:1fr}main{padding:16px 13px 40px}
    table{font-size:13.5px}th,td{padding:6px 8px}}
</style>
</head>
<body>
<header>
  <h1 data-s="title">The atlas in numbers</h1>
  <span class="sub" data-s="built"></span>
  <nav>
    <a href="artatlas.html" data-s="back">← back to the atlas</a>
    <span class="langs" id="langs"></span>
  </nav>
</header>
<main id="main">
  <p class="note" data-s="caveat"></p>
  <div id="body"></div>
</main>
<footer>
  <span data-s="foot"></span>
</footer>

let lang = "en", DATA = null, NAMES = {};   // NAMES: the atlas' own country dictionary, reused here
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = n => (n == null ? "—" : n.toLocaleString(lang === "en" ? "en-GB" : lang));
const s = k => S[lang][k] ?? S.en[k] ?? k;
// A country is called what the atlas calls it in this language: the dictionary already exists, and a
// page that says "Italy" inside a Spanish sentence looks like a page nobody read.
const cName = c => (NAMES[lang] && NAMES[lang][c]) || c;
function loadNames(l) {
  if (l === "en" || NAMES[l]) return Promise.resolve();
  return fetch(`artatlas/i18n/${l}.json`).then(r => r.ok ? r.json() : null)
    .then(d => { if (d) NAMES[l] = d.countries || {}; }).catch(() => {});
}

function bar(value, max, label, alt) {
  const pct = max ? Math.max(2, Math.round(value / max * 100)) : 0;
  return `<span class="bar${alt ? " alt" : ""}"><i style="width:${pct}%"></i><em>${esc(label)}</em></span>`;
}
function table(head, rows) {
  return `<table><thead><tr>${head.map(h => `<th${h.n ? ' class="n"' : ""}>${esc(h.t)}</th>`).join("")}</tr></thead>` +
         `<tbody>${rows.join("")}</tbody></table>`;
}

function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-s]").forEach(el => {
    const k = el.dataset.s;
    if (k === "built") el.textContent = DATA ? s("built")(DATA.built) : "";
    else if (k === "caveat") el.innerHTML = s("caveat");
    else el.textContent = s(k);
  });
  document.title = s("title") + " · Interactive Atlas of Painting";
  document.querySelectorAll("#langs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (!DATA) return;
  const t = DATA.totals, tr = DATA.travel;
  const maxFrom = Math.max(...tr.from.map(x => x[1]), 1), maxTo = Math.max(...tr.to.map(x => x[1]), 1);
  const maxMade = Math.max(...tr.made_in.map(x => x[1]), 1);
  const maxVenue = Math.max(...DATA.venues.map(v => v.works), 1);
  const maxCity = Math.max(...DATA.cities.map(v => v.works), 1);
  const maxCent = Math.max(...DATA.by_century.map(c => c.works), 1);
  const maxTheme = Math.max(...DATA.themes.map(c => c.works), 1);
  const card = (v, label) => `<div class="card"><b>${num(v)}</b><span>${esc(label)}</span></div>`;

  document.getElementById("body").innerHTML =
    `<h2>${esc(s("made"))}</h2><p class="lede">${esc(s("madeLede"))}</p>
     <div class="cards">
       ${card(t.works, s("works"))}${card(t.painters, s("painters"))}${card(t.venues, s("venues"))}
       ${card(t.cities, s("cities"))}${card(t.countries, s("countries"))}
       ${card(t.with_qid, s("withQid"))}${card(t.with_image, s("withImage"))}
       ${card(t.dated, s("dated"))}${card(t.accepted, s("accepted"))}
     </div>

     <h2>${esc(s("travel"))}</h2><p class="lede">${esc(s("travelLede"))}</p>
     <div class="cards">
       ${card(tr.travelled, s("travelled"))}${card(tr.stayed, s("stayed"))}
     </div>
     <div class="split" style="margin-top:14px">
       <div><h2 style="font-size:15px;margin-top:8px">${esc(s("leftFrom"))}</h2>
         ${table([{t: s("from")}, {t: ""}], tr.from.map(([c, n]) =>
           `<tr><td>${esc(cName(c))}</td><td>${bar(n, maxFrom, num(n))}</td></tr>`))}</div>
       <div><h2 style="font-size:15px;margin-top:8px">${esc(s("arrivedIn"))}</h2>
         ${table([{t: s("to")}, {t: ""}], tr.to.map(([c, n]) =>
           `<tr><td>${esc(cName(c))}</td><td>${bar(n, maxTo, num(n), true)}</td></tr>`))}</div>
     </div>
     <h2 style="font-size:15px">${esc(s("routes"))}</h2>
     ${table([{t: s("from")}, {t: s("to")}, {t: s("works"), n: true}],
        tr.pairs.map(p => `<tr><td>${esc(cName(p.from))}</td><td>${esc(cName(p.to))}</td><td class="n">${num(p.works)}</td></tr>`))}
     <h2 style="font-size:15px">${esc(s("madeIn"))}</h2>
     ${table([{t: s("city")}, {t: ""}], tr.made_in.map(([c, n]) =>
        `<tr><td>${esc(c)}</td><td>${bar(n, maxMade, num(n))}</td></tr>`))}

     <h2>${esc(s("conc"))}</h2><p class="lede">${esc(s("concLede"))}</p>
     <div class="split">
       <div><h2 style="font-size:15px;margin-top:8px">${esc(s("mostConc"))}</h2>
         ${table([{t: s("painter")}, {t: s("share")}, {t: s("venue")}], DATA.concentration.most.map(r =>
           `<tr><td>${esc(r.painter)}</td><td>${bar(r.share * 100, 100, Math.round(r.share * 100) + "%")}</td>
            <td>${esc(r.museum)}</td></tr>`))}</div>
       <div><h2 style="font-size:15px;margin-top:8px">${esc(s("leastConc"))}</h2>
         ${table([{t: s("painter")}, {t: s("share")}, {t: s("spread"), n: true}], DATA.concentration.least.map(r =>
           `<tr><td>${esc(r.painter)}</td><td>${bar(r.share * 100, 100, Math.round(r.share * 100) + "%", true)}</td>
            <td class="n">${num(r.venues)}</td></tr>`))}</div>
     </div>

     <h2>${esc(s("holders"))}</h2>
     ${table([{t: s("museum")}, {t: s("city")}, {t: ""}, {t: s("painters"), n: true}], DATA.venues.map(v =>
        `<tr><td>${esc(v.museum)}</td><td>${esc(v.city)}</td><td>${bar(v.works, maxVenue, num(v.works))}</td>
         <td class="n">${num(v.painters)}</td></tr>`))}

     <h2>${esc(s("cityTable"))}</h2>
     ${table([{t: s("city")}, {t: s("countries")}, {t: ""}], DATA.cities.map(v =>
        `<tr><td>${esc(v.city)}</td><td>${esc(cName(v.country))}</td><td>${bar(v.works, maxCity, num(v.works), true)}</td></tr>`))}

     <h2>${esc(s("century"))}</h2><p class="lede">${esc(s("centuryLede"))}</p>
     ${table([{t: ""}, {t: ""}], DATA.by_century.filter(c => c.works > 5).map(c =>
        `<tr><td style="width:6em">${c.century}xx</td><td>${bar(c.works, maxCent, num(c.works))}</td></tr>`))}

     <h2>${esc(s("themes"))}</h2><p class="lede">${esc(s("themesLede"))}</p>
     ${table([{t: s("theme")}, {t: ""}, {t: s("room")}], DATA.themes.map(th =>
        `<tr><td><a href="artatlas.html?th=${encodeURIComponent(th.id)}">${esc(th.label)}</a></td>
         <td>${bar(th.works, maxTheme, num(th.works))}</td><td>${esc(th.top_venue)}</td></tr>`))}

     <h2>${esc(s("coverage"))}</h2><p class="lede">${s("coverageLede")}</p>
     ${table([{t: s("painter")}, {t: s("ours"), n: true}, {t: s("wd"), n: true}, {t: s("ratio"), n: true}],
        DATA.coverage.map(r => `<tr><td>${esc(r.name)}</td><td class="n">${num(r.ours)}</td>
         <td class="n">${num(r.wikidata_with_image)}</td>
         <td class="n ratio ${r.ratio == null ? "" : r.ratio < 0.8 ? "low" : r.ratio > 1.2 ? "high" : ""}">${
           r.ratio == null ? "—" : r.ratio.toFixed(2)}</td></tr>`))}`;
}

document.getElementById("langs").innerHTML = ["en", "es", "fr", "it"]
  .map(l => `<button type="button" data-lang="${l}">${l.toUpperCase()}</button>`).join("");
document.getElementById("langs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("atlasLang", lang); } catch (err) { /* private mode */ }
  loadNames(lang).then(render);
});
try { const l = localStorage.getItem("atlasLang"); if (l && S[l]) lang = l; } catch (e) { /* private mode */ }
const url = new URLSearchParams(location.search).get("lang");
if (url && S[url]) lang = url;
render();
loadNames(lang).then(render);
fetch("artatlas/data/stats.json?v=1.22.1").then(r => r.json()).then(d => { DATA = d; render(); })
  .catch(() => { document.getElementById("body").innerHTML = "<p>stats.json is not there yet.</p>"; });
</script>
</body>
</html>
