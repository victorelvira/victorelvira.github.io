<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Interactive Atlas of Painting · masterpieces in space and time</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%237a5a3a' d='M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z'/%3E%3Ccircle cx='12' cy='9' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
  <meta name="description" content="An interactive atlas of the great painters — where their masterpieces are today and where they were painted, across space and time. Caravaggio, Leonardo, Raphael, Goya, Velázquez, Botticelli, Titian, Vermeer and more. Data from Wikidata, Wikipedia and Wikimedia Commons.">
  <meta name="author" content="Víctor Elvira">
  <meta name="theme-color" content="#3a2317">
  <!-- social share cards -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Interactive Atlas of Painting">
  <meta property="og:description" content="Masterpieces in space and time — where the great painters' works are today and where they were made.">
  <meta property="og:image" content="https://commons.wikimedia.org/wiki/Special:FilePath/Judith%20Beheading%20Holofernes%20-%20Caravaggio.jpg?width=1200">
  <meta property="og:url" content="https://victorelvira.github.io/projects/atlas.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="atlas/vendor/leaflet.css">
  <link rel="stylesheet" href="atlas/vendor/MarkerCluster.css">
  <link rel="stylesheet" href="atlas/style.css?v=0.27.5">
</head>
<body>
  <nav id="navbar">
    <a class="wordmark" href="https://victorelvira.github.io">Víctor&nbsp;Elvira</a>
    <span class="nav-sep">·</span>
    <a class="nav-home" href="https://victorelvira.github.io/personal_projects.html">other interactive projects</a>
    <span id="build" class="build" title="Version and last update"></span>
  </nav>
  <header id="bar">
    <a class="brand" href="atlas.html" title="Reload the atlas (clears filters)">
      <svg class="mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path fill="#3a2317" d="M12 2c-3.9 0-7 3.1-7 7 0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/>
        <rect x="8.4" y="6" width="7.2" height="6" rx="1" fill="#fff"/>
        <circle cx="10.4" cy="9.6" r="1" fill="#c8a24a"/>
        <path d="M9 11l1.8-1.6L12 11l1.4-1.1L15 11z" fill="#3a2317"/>
      </svg>
      <div>
        <strong>Interactive Atlas of Painting</strong>
        <small>masterpieces in space and time</small>
      </div>
    </a>
    <div id="stats" class="stats">…</div>
    <div class="filters">
      <span id="painters" class="painters"></span>
      <label class="chip kind mus"><input type="checkbox" data-kind="museum" checked> Museums</label>
      <label class="chip kind igl"><input type="checkbox" data-kind="church" checked> Churches</label>
      <label class="chip kind pri"><input type="checkbox" data-kind="private" checked> Private</label>
      <label class="chip att" title="Show only works of accepted attribution — hides disputed works and the long tail of undocumented workshop copies"><input type="checkbox" id="accepted-only" checked> Accepted only</label>
      <button id="locate" class="chip btn" type="button" title="Find the painting nearest to your location">📍 Near me</button>
    </div>
  </header>

  <div id="modes">
    <button type="button" class="mode-btn active" data-mode="current">📍 Now in</button>
    <button type="button" class="mode-btn" data-mode="painted">🎨 Painted in</button>
    <span id="view">
      <button type="button" id="v-map" class="view-btn active" title="Show/hide the map">🗺 Map</button>
      <button type="button" id="v-list" class="view-btn active" title="Show/hide the list">☰ List</button>
    </span>
    <button type="button" id="v-table" class="view-btn" title="Browse every work as a sortable table">▦ Table</button>
  </div>

  <div id="timeline">
    <span class="tl-cap">Painted</span>
    <div class="tl-range">
      <div class="tl-track"></div>
      <div id="tl-fill" class="tl-fill"></div>
      <input type="range" id="tl-min" aria-label="From year">
      <input type="range" id="tl-max" aria-label="To year">
    </div>
    <span id="tl-label" class="tl-val">—</span>
  </div>

  <div id="main">
    <div id="map"></div>
    <aside id="panel">
      <div id="panel-head">Works in view</div>
      <ul id="worklist"></ul>
    </aside>
  </div>

  <section id="table" hidden>
    <div id="table-bar">
      <span id="table-tabs">
        <button type="button" class="ttab active" data-tmode="works">Works</button>
        <button type="button" class="ttab" data-tmode="museums">Museums</button>
      </span>
      <input id="table-search" type="search" placeholder="Filter — title, painter, museum, city…" autocomplete="off">
      <span id="table-count" class="t-count"></span>
      <button type="button" id="table-csv" class="chip btn" title="Download the current rows as CSV">⭳ CSV</button>
    </div>
    <div id="table-wrap">
      <table id="works-table">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <div id="sheet" hidden>
    <button id="sheet-close" type="button" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>

  <div id="lightbox" hidden>
    <button id="lb-close" type="button" aria-label="Close">✕</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  </div>

  <footer id="foot">
    <a class="home" href="https://victorelvira.github.io">← victorelvira.github.io</a>
    · Data: <a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a>
    · <a href="https://en.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>
    · <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a>
    · Missing a work or spotted an error? <span class="hint">fix it on Wikidata</span>
  </footer>

  <script src="atlas/vendor/leaflet.js"></script>
  <script src="atlas/vendor/leaflet.markercluster.js"></script>
  <script src="atlas/app.js?v=0.27.5"></script>
</body>
</html>
