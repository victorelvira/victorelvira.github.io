<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batalla de Flores de Laredo en datos · se ha mudado</title>

<!-- Esta página sustituye a la copia que vivía aquí. La web tiene ahora una
     sola casa, https://batalladedatos.es, y esta dirección se conserva porque
     hay enlaces y marcadores apuntando a ella desde hace años.

     `canonical` es lo que le dice a Google cuál es la buena; sin él las dos
     direcciones compiten entre sí y ninguna gana. -->
<link rel="canonical" href="https://batalladedatos.es/">
<meta name="robots" content="noindex, follow">

<!-- El salto lo hace el script, NO un meta refresh, por una razón concreta: un
     meta refresh se lleva la dirección pelada y tira el fragmento, y aquí el
     fragmento es el contenido. Un enlace a
     …/batalla_de_flores.html#/ediciones/c/2009-sinfonia-del-cantabrico-a-8
     tiene que llegar a esa carroza, no a la portada. El meta va detrás, con
     retardo, solo para quien tenga el JavaScript desactivado. -->
<meta http-equiv="refresh" content="3; url=https://batalladedatos.es/">
<script>
  (function () {
    var destino = "https://batalladedatos.es/" + (location.hash || "") + (location.search || "");
    // `replace` y no `assign`: si dejamos el desvío en el historial, el botón
    // de atrás vuelve aquí y rebota otra vez. Se sale del sitio a trompicones.
    location.replace(destino);
  })();
</script>

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f6f1ea; color: #221716;
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1d1818; color: #f2e9e2; }
  }
  .caja { max-width: 34rem; text-align: center; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; letter-spacing: -.01em; }
  p { margin: 0 0 14px; }
  a { color: #b6465f; font-weight: 600; }
  @media (prefers-color-scheme: dark) { a { color: #e0899c; } }
  .flor { font-size: 2rem; display: block; margin-bottom: 10px; }
</style>
</head>
<body>
  <div class="caja">
    <span class="flor">🌺</span>
    <h1>El archivo se ha mudado</h1>
    <p>La Batalla de Flores de Laredo en datos vive ahora en
      <a href="https://batalladedatos.es/">batalladedatos.es</a>, con su propia
      dirección y una sola copia que mantener.</p>
    <p>Te estamos llevando allí. Si no pasa nada,
      <a href="https://batalladedatos.es/">entra tú mismo</a>.</p>
  </div>
</body>
</html>
