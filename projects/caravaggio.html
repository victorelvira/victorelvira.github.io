<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Caravaggio · where his works are today</title>
  <meta name="description" content="Interactive map of the current location of every work by Caravaggio around the world. Data from Wikidata, Wikipedia and Wikimedia Commons.">
  <meta name="theme-color" content="#3a2317">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="caravaggio/style.css">
</head>
<body>
  <header id="bar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <strong>Caravaggio</strong>
        <small>where his works are today</small>
      </div>
    </div>
    <div id="stats" class="stats">…</div>
    <div class="filters">
      <label class="chip mus"><input type="checkbox" data-kind="museum" checked> Museums</label>
      <label class="chip igl"><input type="checkbox" data-kind="church" checked> Churches</label>
      <label class="chip pri"><input type="checkbox" data-kind="private" checked> Private</label>
      <label class="chip att"><input type="checkbox" id="only-accepted"> Accepted attribution only</label>
    </div>
  </header>

  <div id="map"></div>

  <footer id="foot">
    <a class="home" href="https://victorelvira.github.io">← victorelvira.github.io</a>
    · Data: <a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a>
    · <a href="https://en.wikipedia.org/" target="_blank" rel="noopener">Wikipedia</a>
    · <a href="https://commons.wikimedia.org/" target="_blank" rel="noopener">Wikimedia Commons</a>
    · Missing a work or spotted an error? <span class="hint">fix it on Wikidata</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="caravaggio/app.js"></script>
</body>
</html>
