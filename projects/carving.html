<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Interactive Atlas of Wood Carving · where the carvings are</title>
  <link rel="icon" href="carving/favicon.svg">
  <meta name="description" content="An interactive atlas of wood carving — statues, altarpieces, choir stalls and reliquaries, mapped where they stand today. Map, gallery and table views. Data from the Palissy database of the French Ministry of Culture.">
  <meta name="author" content="Víctor Elvira">
  <meta name="theme-color" content="#2a1d12">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Interactive Atlas of Wood Carving">
  <meta property="og:description" content="Statues, altarpieces and choir stalls in wood, mapped where they stand today.">
  <meta property="og:url" content="https://victorelvira.github.io/projects/carving.html">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="carving/vendor/leaflet.css">
  <link rel="stylesheet" href="carving/vendor/MarkerCluster.css">
  <link rel="stylesheet" href="carving/style.css?v=0.4.2">
</head>
<body>
  <nav id="navbar">
    <a class="wordmark" href="https://victorelvira.github.io">Víctor&nbsp;Elvira</a>
    <span class="nav-sep">·</span>
    <a class="nav-home" href="https://victorelvira.github.io/personal_projects.html" data-i18n="nav.other">other interactive projects</a>
    <button id="lang" class="langbtn" type="button" data-i18n="lang.switch">Español</button>
    <span id="build" class="build" data-i18n-title="nav.build"></span>
  </nav>

  <header id="bar">
    <a class="brand" href="carving.html" data-i18n-title="brand.reload">
      <svg class="mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M14.8 2.6l6.6 6.6-2.5 2.5-6.6-6.6z" fill="#6b4423"/>
        <path d="M12.3 5.1l6.6 6.6-1.3 1.3-6.6-6.6z" fill="#c9a227"/>
        <path d="M11 6.4l6.6 6.6-6.9 6.9-3.6-.9-.9-3.6z" fill="#b8b5ae"/>
        <path d="M11 6.4l6.6 6.6-6.9 6.9z" fill="#d8d5cd"/>
        <path d="M6.2 15.4l.9 3.6 3.6.9-1.9 1.9c-2.6.6-4.9-1.4-4.5-4z" fill="#8a5a2b"/>
      </svg>
      <div>
        <strong data-i18n="brand.title">Interactive Atlas of Wood Carving</strong>
        <small data-i18n="brand.tagline">where the carvings are</small>
      </div>
    </a>
    <div id="stats" class="stats">…</div>
  </header>

  <div id="modes">
    <span id="view-tabs">
      <button type="button" class="view-btn active" data-view="map" data-i18n="view.map" data-i18n-title="view.map.t">🗺 Map &amp; list</button>
      <button type="button" class="view-btn" data-view="gallery" data-i18n="view.gallery" data-i18n-title="view.gallery.t">▦ Gallery</button>
      <button type="button" class="view-btn" data-view="table" data-i18n="view.table" data-i18n-title="view.table.t">☰ Table</button>
    </span>
    <input id="search" type="search" data-i18n-ph="search.ph" autocomplete="off" aria-label="Search">
    <span id="result-count" class="t-count"></span>
    <button id="clear-filters" class="chip btn" type="button" data-i18n="clear">Clear</button>
  </div>

  <div id="filters">
    <span id="sources" class="chips" aria-label="Collection"></span>
    <span class="fsep"></span>
    <span id="kinds" class="chips" aria-label="Object type"></span>
    <span class="fsep"></span>
    <span id="forms" class="chips" aria-label="Relief or in the round"></span>
    <span class="fsep"></span>
    <span id="finishes" class="chips" aria-label="Finish"></span>
    <span class="fsep"></span>
    <label class="chip toggle" data-i18n-title="named.t"><input type="checkbox" id="named-only"><span data-i18n="named">Named carver</span></label>
  </div>

  <div id="timeline">
    <span class="tl-cap" data-i18n="carved">Carved</span>
    <div class="tl-range">
      <div class="tl-track"></div>
      <div id="tl-fill" class="tl-fill"></div>
      <input type="range" id="tl-min" aria-label="From year">
      <input type="range" id="tl-max" aria-label="To year">
    </div>
    <span id="tl-label" class="tl-val">—</span>
  </div>

  <div id="main">
    <div id="map"></div>
    <aside id="panel">
      <div id="panel-head" data-i18n="panel.head">Carvings in view</div>
      <ul id="worklist"></ul>
    </aside>
  </div>

  <section id="gallery" hidden>
    <div id="grid" class="grid"></div>
    <button id="more" class="more" type="button" hidden></button>
  </section>

  <section id="table" hidden>
    <div id="table-wrap">
      <table id="works-table"><thead></thead><tbody></tbody></table>
    </div>
    <button id="more-table" class="more" type="button" hidden></button>
  </section>

  <div id="sheet" hidden>
    <button id="sheet-close" type="button" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>

  <div id="lightbox" hidden>
    <button id="lb-close" type="button" aria-label="Close">✕</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
  </div>

  <footer id="foot">
    <a class="home" href="https://victorelvira.github.io">← victorelvira.github.io</a>
    · <span data-i18n="foot.data">Data</span>: <a href="https://www.pop.culture.gouv.fr/" target="_blank" rel="noopener">Base Palissy</a>, <a href="https://dati.beniculturali.it/" target="_blank" rel="noopener">ArCo</a>, <a href="https://www.wikidata.org/" target="_blank" rel="noopener">Wikidata</a>
    · <span data-i18n="foot.linked">Photographs are linked from their source, never redistributed</span>
  </footer>

  <script src="carving/vendor/leaflet.js"></script>
  <script src="carving/vendor/leaflet.markercluster.js"></script>
  <script src="carving/i18n.js?v=0.4.2"></script>
  <script src="carving/app.js?v=0.4.2"></script>
  <script data-goatcounter="https://victorelvira.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
