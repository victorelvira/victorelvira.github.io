<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Culture Atlas. A marker standing inside a place: the pin is the map, the rounded slab
       inside it is the thing that is actually there — a stone, a plaque, a stele. Light on moss,
       because a favicon has to survive a white browser tab at 16 px, and a coloured ground is
       what makes it survive. -->
  <rect width="32" height="32" rx="7" fill="#5a6b57"/>
  <path d="M16 4.2c-4.4 0-8 3.6-8 8 0 5.9 8 15.6 8 15.6s8-9.7 8-15.6c0-4.4-3.6-8-8-8z" fill="#f4f2ec"/>
  <rect x="12.2" y="8.2" width="7.6" height="8.6" rx="3.8" fill="#5a6b57"/>
  <circle cx="16" cy="12.5" r="1.7" fill="#c8a24a"/>
</svg>
