<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Frontones · Cantabria y Euskadi</title>
  <meta name="description" content="Mapa de frontones de Cantabria y el País Vasco. Datos abiertos de OpenStreetMap y el Gobierno de Cantabria.">
  <meta name="theme-color" content="#1b5e3f">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="frontones/style.css">
</head>
<body>
  <nav id="navbar">
    <a class="wordmark" href="https://victorelvira.github.io">Víctor&nbsp;Elvira</a>
    <span class="nav-sep">·</span>
    <a class="nav-home" href="https://victorelvira.github.io/personal_projects.html">other interactive projects</a>
  </nav>
  <header id="bar">
    <div class="brand">
      <span class="dot"></span>
      <div>
        <strong>Frontones</strong>
        <small>Cantabria · Euskadi</small>
      </div>
    </div>
    <div id="stats" class="stats">…</div>
    <div class="filters">
      <label class="chip cb"><input type="checkbox" data-region="cantabria" checked> Cantabria</label>
      <label class="chip pv"><input type="checkbox" data-region="euskadi" checked> Euskadi</label>
      <label class="chip ver"><input type="checkbox" id="solo-verificados"> Solo verificados</label>
      <button id="near-me" class="chip act" type="button">📍 Cerca de mí</button>
      <button id="report" class="chip act2" type="button">➕ Falta uno / error</button>
    </div>
  </header>

  <div id="map"></div>

  <div id="report-banner" hidden>📍 Pincha en el mapa dónde está el frontón <button id="report-abort" type="button">cancelar</button></div>

  <div id="report-panel" hidden>
    <form id="report-form">
      <h3>Reportar un frontón</h3>
      <div class="loc" id="report-loc"></div>
      <label>Tipo
        <select name="tipo">
          <option value="falta">Falta este frontón</option>
          <option value="error">Hay un error aquí</option>
          <option value="otro">Otro</option>
        </select>
      </label>
      <input name="nombre" placeholder="Nombre del frontón (si lo sabes)">
      <input name="municipio" placeholder="Municipio">
      <textarea name="nota" rows="2" placeholder="Detalles: cubierto/descubierto, estado, tipo…"></textarea>
      <input name="email" type="email" placeholder="Tu email (opcional, por si te consulto)">
      <input type="hidden" name="lat"><input type="hidden" name="lon">
      <input type="hidden" name="pagina" value="frontones">
      <div class="row">
        <button type="button" id="report-cancel">Cancelar</button>
        <button type="submit" id="report-send">Enviar</button>
      </div>
      <div class="msg" id="report-msg"></div>
    </form>
  </div>

  <footer id="foot">
    Datos: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a> (ODbL)
    · <a href="https://mapas.cantabria.es/" target="_blank" rel="noopener">Gobierno de Cantabria</a>
    · ¿Falta uno o hay un error? <span class="hint">púlsalo y corrígelo en OSM</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="frontones/app.js"></script>
