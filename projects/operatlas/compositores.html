<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operatlas · composers</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ec; --panel:#fffdf8; --panel2:#f1eadb; --line:#e7decb;
    --txt:#2b2620; --dim:#867a64; --accent:#9d2933;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .brand{font-size:19px;font-weight:600;letter-spacing:.4px}
  .brand span{color:var(--accent)}
  nav{display:flex;gap:4px}
  nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:5px 11px;border-radius:6px}
  nav a:hover{background:var(--panel2);color:var(--txt)}
  nav a.on{color:var(--accent);background:var(--panel2)}
  .tools{margin-left:auto;display:flex;gap:9px;align-items:center}
  input,select{padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:13px}
  .count{color:var(--dim);font-size:13px;padding:8px 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:6px 22px 60px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .12s,transform .12s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card h3{margin:0 0 3px;font-size:17px;font-weight:600}
  .card .era{color:var(--dim);font-size:12.5px;margin-bottom:12px}
  .stats{display:flex;gap:16px;margin-bottom:12px}
  .stat .n{font-size:22px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
  .stat .l{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
  .top{font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);padding-top:10px}
  .top b{color:var(--txt);font-weight:600}
  .popbar{height:4px;border-radius:2px;background:#352c24;margin-top:10px;overflow:hidden}
  .popbar>span{display:block;height:4px;background:var(--accent);opacity:.6}

  /* barra de identidad compartida (misma en todos los proyectos) */
  body{display:flex;flex-direction:column;min-height:100vh}
  #navbar{display:flex;align-items:center;gap:7px;padding:5px 16px;background:#f1eadb;font-size:12.5px;flex:0 0 auto}
  #navbar .wordmark{color:#2b2620;font-weight:700;text-decoration:none;letter-spacing:.2px}
  #navbar .nav-sep{color:#b3a68d}
  #navbar .nav-home{color:#d8cbb2;text-decoration:none}
  #navbar a:hover{text-decoration:underline}
  .emblem{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
  .brand,header h1{cursor:pointer}

  /* nav-tiers */
  nav .nav-div{display:inline-block;width:1px;height:16px;background:var(--line);margin:0 8px;vertical-align:middle}
  nav a.lens{font-size:12px;color:#948873}
  nav a.lens:hover{color:var(--txt);background:var(--panel2)}
  nav a.lens.on{color:var(--accent)}

  /* elegant-type */
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,.brand,.fh1,.hero h1,.marca{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif !important;font-weight:600;letter-spacing:.01em}
  .brand{font-size:22px;letter-spacing:.02em}
  .fh1,.hero h1{font-weight:600;letter-spacing:.008em}
  h2{font-weight:600}

  /* master-logo */
  .marca{cursor:pointer;white-space:nowrap}
  .marca .p,.marca .oa,.marca .sp{color:var(--txt)}
  .marca .oa,.marca .sp{display:inline-block;overflow:hidden;white-space:pre;vertical-align:bottom;
    transition:max-width .6s cubic-bezier(.4,0,.2,1),opacity .45s ease,transform .55s ease}
  .marca .oa{max-width:var(--wa,1ch)}
  .marca .sp{max-width:var(--wsp,.35ch)}
  .marca .w2{display:inline-block;color:var(--txt);transition:color .6s ease}
  .marca.on .oa{max-width:0;opacity:0;transform:translateX(.14em)}
  .marca.on .sp{max-width:0}
  .marca.on .w2{color:var(--accent)}
  .marca.on:hover .oa{max-width:var(--wa);opacity:1;transform:none}
  .marca.on:hover .sp{max-width:var(--wsp)}
  .marca.on:hover .w2{color:var(--txt)}
  @media(prefers-reduced-motion:reduce){.marca .oa,.marca .sp,.marca .w2{transition:none}}
</style>
</head>
<body>
<nav id="navbar">
  <a class="wordmark" href="https://victorelvira.github.io">Víctor&nbsp;Elvira</a>
  <span class="nav-sep">·</span>
  <a class="nav-home" href="https://victorelvira.github.io/personal_projects.html">other interactive projects</a>
</nav>

<header>
  <span class="brand"><img class="emblem" src="favicon.svg" alt=""><span class="marca"><span class="p">Oper</span><span class="oa">a</span><span class="sp"> </span><span class="w2">Atlas</span></span></span>
  <nav>
      <a href="nucleo.html">Operas</a>
      <a href="empezar.html">Start here</a>
      <a href="jugar.html">Play</a>
      <a href="compositores.html" class="on">Composers</a>
      <a href="personajes.html">Characters</a>
      <span class="nav-div"></span>
      <a href="conexiones.html" class="lens">Connections</a>
      <a href="timeline.html" class="lens">Timeline</a>
      <a href="analisis.html" class="lens">Trends</a>
      <a href="pulso.html" class="lens">Pulse</a>
      <a href="duraciones.html" class="lens">Durations</a>
      <a href="mapa.html" class="lens">Map</a>
    </nav>
  <div class="tools">
    <input id="q" type="text" placeholder="search composer…" autocomplete="off">
    <select id="sort">
      <option value="pop">↓ most performed</option>
      <option value="operas">↓ most operas</option>
      <option value="chrono">chronological</option>
      <option value="alpha">A–Z</option>
    </select>
  </div>
</header>
<div class="count" id="count">loading…</div>
<div class="grid" id="grid"></div>
<script>
let COMPS=[], MAXPOP=1;
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function eraOf(styles){
  // estilo dominante (más frecuente)
  const c={}; styles.forEach(s=>{if(s)c[s]=(c[s]||0)+1;});
  const top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];
  return top?top[0]:null;
}
function yearOf(o){ return o.wd_year || null; }  // solo años limpios (ob_premiere está sucio)

function draw(){
  const q=$('#q').value.toLowerCase().trim(), s=$('#sort').value;
  let list=COMPS.filter(c=>!q||c.name.toLowerCase().includes(q));
  list.sort((a,b)=> s==='alpha'?a.name.localeCompare(b.name)
    : s==='operas'?b.n-a.n
    : s==='chrono'?((a.ymid||9999)-(b.ymid||9999))
    : b.pop-a.pop);
  $('#count').textContent=`${list.length} composers · ${COMPS.reduce((s,c)=>s+c.n,0)} operas`;
  $('#grid').innerHTML=list.map(c=>{
    const span=c.ymin&&c.ymax?`${c.ymin}–${c.ymax}`:'';
    return `<div class="card" onclick="location.href='compositor.html?c=${encodeURIComponent(c.name)}'">
      <h3>${esc(c.name)}</h3>
      <div class="era">${esc(c.era||'—')}${span?' · operas '+span:''}</div>
      <div class="stats">
        <div class="stat"><div class="n">${c.n}</div><div class="l">operas</div></div>
        ${c.durs?`<div class="stat"><div class="n">${c.durs}</div><div class="l">with duration</div></div>`:''}
      </div>
      <div class="top">best known: <b>${esc(c.top)}</b></div>
      <div class="popbar"><span style="width:${Math.round(100*Math.sqrt(c.pop/MAXPOP))}%"></span></div>
    </div>`;
  }).join('');
}
$('#q').oninput=draw; $('#sort').onchange=draw;

fetch('core.json').then(r=>r.json()).then(core=>{
  const by={};
  for(const o of core){
    const k=o.composer;
    (by[k]=by[k]||{name:k,ops:[]}).ops.push(o);
  }
  COMPS=Object.values(by).map(c=>{
    const ops=c.ops;
    const years=ops.map(yearOf).filter(Boolean);
    const top=ops.slice().sort((a,b)=>b.perfs-a.perfs)[0];
    return {
      name:c.name, n:ops.length,
      pop:ops.reduce((s,o)=>s+(o.perfs||0),0),
      durs:ops.filter(o=>o.rt_acts||o.mb_acts).length,
      era:eraOf(ops.map(o=>o.style)),
      top:top?top.title:'—',
      ymin:years.length?Math.min(...years):null,
      ymax:years.length?Math.max(...years):null,
      ymid:years.length?years.sort((a,b)=>a-b)[Math.floor(years.length/2)]:null,
    };
  });
  MAXPOP=Math.max(...COMPS.map(c=>c.pop||1));
  draw();
}).catch(e=>{$('#count').textContent='Error loading core.json — '+e;});
</script>
<script>/*brand-home*/(document.querySelector(".brand")||document.querySelector("header h1"))&&(document.querySelector(".brand")||document.querySelector("header h1")).addEventListener("click",()=>location.href="index.html");</script>
<script>/* master-logo-js */(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function initAll(){document.querySelectorAll('.marca').forEach(function(m){
    if(m.dataset.mi) return; m.dataset.mi='1';
    var oa=m.querySelector('.oa'), sp=m.querySelector('.sp'); if(!oa||!sp) return;
    var measure=function(){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');};
    measure(); addEventListener('resize',measure);
    if(reduce){m.classList.add('on');}
    else{requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(function(){m.classList.add('on');},650);});});}
  });}
  initAll(); if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){
    document.querySelectorAll('.marca').forEach(function(m){var oa=m.querySelector('.oa'),sp=m.querySelector('.sp');if(oa&&sp){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');}});});}
})();</script>
</body>
</html>
