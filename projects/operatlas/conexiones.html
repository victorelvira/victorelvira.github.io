<style>
  :root{--bg:#faf6ec;--panel:#fffdf8;--panel2:#f1eadb;--line:#e7decb;--txt:#2b2620;--dim:#867a64;--accent:#9d2933;--src:#8aa6bf}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  header{display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:5;flex-wrap:wrap}
  .brand{font-size:19px;font-weight:600;letter-spacing:.4px}.brand span{color:var(--accent)}
  nav{display:flex;gap:4px}
  nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:5px 11px;border-radius:6px}
  nav a:hover{background:var(--panel2);color:var(--txt)} nav a.on{color:var(--accent);background:var(--panel2)}
  .tools{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:13px;color:var(--dim)}
  .tools label{display:flex;gap:6px;align-items:center;cursor:pointer}
  #wrap{position:relative;flex:1;min-height:0}
  canvas{display:block;cursor:grab}
  #tip{position:absolute;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;max-width:240px;display:none;z-index:10}
  #tip b{color:var(--accent)}
  #hint{position:absolute;left:22px;bottom:16px;font-size:12px;color:#867a67;z-index:5}
  .leg{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--dim);z-index:5;text-align:right;line-height:1.7}
  .leg .d{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;margin-right:5px}

  /* barra de identidad compartida (misma en todos los proyectos) */
  body{display:flex;flex-direction:column;min-height:100vh}
  #navbar{display:flex;align-items:center;gap:7px;padding:5px 16px;background:#f1eadb;font-size:12.5px;flex:0 0 auto}
  #navbar .wordmark{color:#2b2620;font-weight:700;text-decoration:none;letter-spacing:.2px}
  #navbar .nav-sep{color:#b3a68d}
  #navbar .nav-home{color:#d8cbb2;text-decoration:none}
  #navbar a:hover{text-decoration:underline}
  .emblem{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
  .brand,header h1{cursor:pointer}

  /* nav-tiers */
  nav .nav-div{display:inline-block;width:1px;height:16px;background:var(--line);margin:0 8px;vertical-align:middle}
  nav a.lens{font-size:12px;color:#948873}
  nav a.lens:hover{color:var(--txt);background:var(--panel2)}
  nav a.lens.on{color:var(--accent)}

  /* elegant-type */
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,.brand,.fh1,.hero h1,.marca{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif !important;font-weight:600;letter-spacing:.01em}
  .brand{font-size:22px;letter-spacing:.02em}
  .fh1,.hero h1{font-weight:600;letter-spacing:.008em}
  h2{font-weight:600}

  /* master-logo */
  .marca{cursor:pointer;white-space:nowrap}
  .marca .p,.marca .oa,.marca .sp{color:var(--txt)}
  .marca .oa,.marca .sp{display:inline-block;overflow:hidden;white-space:pre;vertical-align:bottom;
    transition:max-width .6s cubic-bezier(.4,0,.2,1),opacity .45s ease,transform .55s ease}
  .marca .oa{max-width:var(--wa,1ch)}
  .marca .sp{max-width:var(--wsp,.35ch)}
  .marca .w2{display:inline-block;color:var(--txt);transition:color .6s ease}
  .marca.on .oa{max-width:0;opacity:0;transform:translateX(.14em)}
  .marca.on .sp{max-width:0}
  .marca.on .w2{color:var(--accent)}
  .marca.on:hover .oa{max-width:var(--wa);opacity:1;transform:none}
  .marca.on:hover .sp{max-width:var(--wsp)}
  .marca.on:hover .w2{color:var(--txt)}
  @media(prefers-reduced-motion:reduce){.marca .oa,.marca .sp,.marca .w2{transition:none}}
</style>

  <span class="brand"><img class="emblem" src="favicon.svg" alt=""><span class="marca"><span class="p">Oper</span><span class="oa">a</span><span class="sp"> </span><span class="w2">Atlas</span></span></span>

    <label><input type="checkbox" id="lib"> add librettists</label>

</header>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="tip"></div>
  <div id="hint">drag to pan · scroll to zoom · click an opera to open it</div>
  <div class="leg"><span class="d" style="background:#8aa6bf"></span>literary source &nbsp; <span class="d" style="background:#c9ad74"></span>opera (size = repertory)<br><span id="legsub"></span></div>
</div>
<script>
const $=s=>document.querySelector(s);
const cv=$('#c'), ctx=cv.getContext('2d'), tip=$('#tip');
let W,H,DPR=window.devicePixelRatio||1;
function resize(){const w=$('#wrap');W=w.clientWidth;H=w.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);

let nodes=[], edges=[], view={x:0,y:0,k:1}, DATA=[];
const rand=(a,b)=>a+Math.random()*(b-a);

function build(withLib){
  const opById={};
  // nodo por ópera con >=1 conexión; hubs por fuente (y libretista opcional)
  const hubs={};   // key -> node
  const opNodes={};
  edges=[];
  function hub(kind,label){
    const id=kind+':'+label;
    if(!hubs[id]) hubs[id]={id,kind,label,hub:true,x:rand(-300,300),y:rand(-200,200),vx:0,vy:0,deg:0};
    return hubs[id];
  }
  function opNode(o){
    if(!opNodes[o.id]) opNodes[o.id]={id:'op:'+o.id,o,label:o.title,x:rand(-300,300),y:rand(-200,200),vx:0,vy:0,deg:0};
    return opNodes[o.id];
  }
  for(const o of DATA){
    const links=[];
    (o.based_on||[]).forEach(s=>links.push(['fuente',s]));
    if(withLib)(o.librettist||[]).forEach(l=>links.push(['libreto',l]));
    for(const [kind,label] of links){
      const h=hub(kind,label); const n=opNode(o);
      edges.push([n,h,kind]); n.deg++; h.deg++;
    }
  }
  // quitar hubs con grado 1 (no conectan nada) y sus operas huérfanas
  for(const id in hubs){ if(hubs[id].deg<2){ // hub que sólo toca 1 ópera: fuera
      edges=edges.filter(e=>e[1]!==hubs[id]); hubs[id].dead=true; } }
  for(const id in opNodes){ const n=opNodes[id]; n.deg=edges.filter(e=>e[0]===n).length; if(!n.deg) n.dead=true; }
  nodes=[...Object.values(hubs),...Object.values(opNodes)].filter(n=>!n.dead);
  edges=edges.filter(e=>!e[0].dead&&!e[1].dead);
  $('#stat').textContent=`${nodes.filter(n=>!n.hub).length} operas · ${nodes.filter(n=>n.hub).length} connected sources`;
  $('#legsub').textContent = withLib?'edges: source + librettist':'edges: literary source';
  view={x:W/2,y:H/2,k:.8}; alpha=1; userMoved=false;
}

let alpha=1, userMoved=false;
function fitView(){
  if(!nodes.length) return;
  const xs=nodes.map(n=>n.x).sort((a,b)=>a-b),ys=nodes.map(n=>n.y).sort((a,b)=>a-b);
  const q=(a,p)=>a[Math.max(0,Math.min(a.length-1,Math.floor(p*(a.length-1))))];
  const x0=q(xs,0.02),x1=q(xs,0.98),y0=q(ys,0.02),y1=q(ys,0.98);
  const cx=(x0+x1)/2,cy=(y0+y1)/2,sw=Math.max(x1-x0,120),sh=Math.max(y1-y0,120);
  view.k=Math.max(0.25,Math.min(2.2,Math.min((W-120)/sw,(H-120)/sh)));
  view.x=W/2-cx*view.k;view.y=H/2-cy*view.k;
}
function tick(){
  if(alpha>0.02){
    // repulsión O(n²)
    for(let i=0;i<nodes.length;i++){const a=nodes[i];
      for(let j=i+1;j<nodes.length;j++){const b=nodes[j];
        let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01;
        if(d2<40000){const f=900/d2;const d=Math.sqrt(d2);const fx=dx/d*f,fy=dy/d*f;
          a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}}}
    // muelles
    for(const [a,b] of edges){let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)+.01;
      const f=(d-70)*0.02;const fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;}
    // gravedad + integración (con límite de velocidad y radio máximo)
    for(const n of nodes){n.vx-=n.x*0.012;n.vy-=n.y*0.012;
      n.vx=Math.max(-25,Math.min(25,n.vx));n.vy=Math.max(-25,Math.min(25,n.vy));
      n.x+=n.vx*alpha;n.y+=n.vy*alpha;n.vx*=0.85;n.vy*=0.85;
      const d=Math.hypot(n.x,n.y);if(d>650){n.x*=650/d;n.y*=650/d;}}
    alpha*=0.985;
    if(!userMoved) fitView();
  }
  render();
  requestAnimationFrame(tick);
}
const MAXPOP=()=>Math.max(...DATA.map(o=>o.perfs||1));
let mp=1;
function opR(o){return 3+8*Math.sqrt((o.perfs||1)/mp);}
function render(){
  ctx.clearRect(0,0,W,H);
  ctx.save();ctx.translate(view.x,view.y);ctx.scale(view.k,view.k);
  ctx.lineWidth=0.6/view.k;
  ctx.strokeStyle='#3a4148';
  for(const [a,b,kind] of edges){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=kind==='libreto'?'#4a3f2e':'#33424e';ctx.stroke();}
  for(const n of nodes){
    if(n.hub){
      ctx.fillStyle=n.kind==='libreto'?'#b18b4a':'var(--src)';ctx.fillStyle=n.kind==='libreto'?'#9b7f3f':'#5f7f9c';
      ctx.beginPath();ctx.arc(n.x,n.y,4,0,7);ctx.fill();
      ctx.fillStyle='#aeb4b9';ctx.font=`${11/view.k}px sans-serif`;ctx.textAlign='center';
      ctx.fillText(n.label.length>26?n.label.slice(0,25)+'…':n.label,n.x,n.y-8/view.k);
    }else{
      const r=opR(n.o);
      ctx.fillStyle=n.hi?'#f0d896':'#c9ad74';
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fill();
      if(view.k>1.4||n.hi){ctx.fillStyle='#efe8dc';ctx.font=`${10/view.k}px sans-serif`;ctx.textAlign='center';
        ctx.fillText(n.label.length>22?n.label.slice(0,21)+'…':n.label,n.x,n.y+r+10/view.k);}
    }
  }
  ctx.restore();
}

// interacción
let drag=null,down=null;
function toWorld(mx,my){return {x:(mx-view.x)/view.k,y:(my-view.y)/view.k};}
function nodeAt(mx,my){const w=toWorld(mx,my);let best=null,bd=1e9;
  for(const n of nodes){if(n.hub)continue;const r=opR(n.o)+3;const d=Math.hypot(n.x-w.x,n.y-w.y);if(d<r&&d<bd){bd=d;best=n;}}
  return best;}
cv.onmousedown=e=>{down={x:e.offsetX,y:e.offsetY,vx:view.x,vy:view.y,moved:false};cv.style.cursor='grabbing';};
cv.onmousemove=e=>{
  if(down){view.x=down.vx+(e.offsetX-down.x);view.y=down.vy+(e.offsetY-down.y);if(Math.hypot(e.offsetX-down.x,e.offsetY-down.y)>4){down.moved=true;userMoved=true;}return;}
  const n=nodeAt(e.offsetX,e.offsetY);
  nodes.forEach(x=>x.hi=false);
  if(n){n.hi=true;tip.style.display='block';tip.style.left=(e.offsetX+14)+'px';tip.style.top=(e.offsetY+14)+'px';
    tip.innerHTML=`<b>${n.o.title}</b><br>${n.o.composer}${n.o.year?' · '+n.o.year:''}<br><span style="color:#a99b87">based on ${(n.o.based_on||[]).join(', ')||'—'}</span>`;
    cv.style.cursor='pointer';}
  else{tip.style.display='none';cv.style.cursor='grab';}
};
cv.onmouseup=e=>{cv.style.cursor='grab';if(down&&!down.moved){const n=nodeAt(e.offsetX,e.offsetY);if(n)location.href='nucleo.html?opera='+encodeURIComponent(n.o.title);}down=null;};
cv.onwheel=e=>{e.preventDefault();userMoved=true;const f=e.deltaY<0?1.1:0.9;const w=toWorld(e.offsetX,e.offsetY);
  view.k=Math.max(0.2,Math.min(6,view.k*f));view.x=e.offsetX-w.x*view.k;view.y=e.offsetY-w.y*view.k;};
$('#lib').onchange=e=>build(e.target.checked);

resize();
fetch('core.json').then(r=>r.json()).then(d=>{DATA=d;mp=MAXPOP();build(false);tick();})
 .catch(e=>{$('#stat').textContent='Error: '+e;});
</script>
<script>/*brand-home*/(document.querySelector(".brand")||document.querySelector("header h1"))&&(document.querySelector(".brand")||document.querySelector("header h1")).addEventListener("click",()=>location.href="index.html");</script>
<script>/* master-logo-js */(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function initAll(){document.querySelectorAll('.marca').forEach(function(m){
    if(m.dataset.mi) return; m.dataset.mi='1';
    var oa=m.querySelector('.oa'), sp=m.querySelector('.sp'); if(!oa||!sp) return;
    var measure=function(){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');};
    measure(); addEventListener('resize',measure);
    if(reduce){m.classList.add('on');}
    else{requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(function(){m.classList.add('on');},650);});});}
  });}
  initAll(); if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){
    document.querySelectorAll('.marca').forEach(function(m){var oa=m.querySelector('.oa'),sp=m.querySelector('.sp');if(oa&&sp){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');}});});}
})();</script>
</body>
