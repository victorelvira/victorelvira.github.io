<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operatlas</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root{
    --bg:#faf6ec; --panel:#fffdf8; --panel2:#f1eadb; --line:#e7decb;
    --txt:#2b2620; --dim:#867a64; --accent:#9d2933; --accent2:#8aa6bf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  #app{display:grid;grid-template-columns:320px 1fr;grid-template-rows:auto 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{margin:0;font-size:20px;letter-spacing:.5px;font-weight:600}
  header h1 span{color:var(--accent)}
  header .count{color:var(--dim);font-size:13px}
  aside{background:var(--panel);border-right:1px solid var(--line);padding:16px;overflow:auto}
  main{position:relative;display:flex;flex-direction:column;min-width:0}
  #map{flex:1;min-height:0;background:#0b0d0e}
  .fld{margin-bottom:16px}
  .fld label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);margin-bottom:6px}
  input[type=text],select{width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:14px}
  input[type=text]:focus,select:focus{outline:none;border-color:var(--accent)}
  .years{display:flex;align-items:center;gap:8px}
  .years input{width:100%}
  .yrlab{font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;min-width:44px;text-align:center}
  .chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--dim);cursor:pointer}
  #timeline{height:96px;border-top:1px solid var(--line);background:var(--panel);padding:6px 10px 4px}
  #timeline svg{width:100%;height:100%;display:block;cursor:crosshair}
  .bar{fill:var(--accent2);opacity:.75}
  .bar:hover{opacity:1;fill:var(--accent)}
  .axis{fill:var(--dim);font-size:10px}
  .btn{width:100%;padding:8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);cursor:pointer;font-size:13px}
  .btn:hover{border-color:var(--accent)}
  #list{max-height:34vh;overflow:auto;border-top:1px solid var(--line)}
  .row{padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
  .row:hover{background:var(--panel2)}
  .row b{color:var(--txt)} .row .meta{color:var(--dim);font-size:12px}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel2);color:var(--txt)}
  .leaflet-popup-content b{color:var(--accent)}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;font-size:12px;color:var(--dim);margin-top:4px}

  /* barra de identidad compartida (misma en todos los proyectos) */
  body{display:flex;flex-direction:column;min-height:100vh}
  #navbar{display:flex;align-items:center;gap:7px;padding:5px 16px;background:#f1eadb;font-size:12.5px;flex:0 0 auto}
  #navbar .wordmark{color:#2b2620;font-weight:700;text-decoration:none;letter-spacing:.2px}
  #navbar .nav-sep{color:#b3a68d}
  #navbar .nav-home{color:#d8cbb2;text-decoration:none}
  #navbar a:hover{text-decoration:underline}
  .emblem{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
  .brand,header h1{cursor:pointer}
  header nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-left:18px}
  header nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:5px 11px;border-radius:6px}
  header nav a:hover{background:var(--panel2);color:var(--txt)}
  header nav a.on{color:var(--accent);background:var(--panel2)}

  /* nav-tiers */
  nav .nav-div{display:inline-block;width:1px;height:16px;background:var(--line);margin:0 8px;vertical-align:middle}
  nav a.lens{font-size:12px;color:#948873}
  nav a.lens:hover{color:var(--txt);background:var(--panel2)}
  nav a.lens.on{color:var(--accent)}

  /* elegant-type */
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,.brand,.fh1,.hero h1,.marca{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif !important;font-weight:600;letter-spacing:.01em}
  .brand{font-size:22px;letter-spacing:.02em}
  .fh1,.hero h1{font-weight:600;letter-spacing:.008em}
  h2{font-weight:600}

  /* master-logo */
  .marca{cursor:pointer;white-space:nowrap}
  .marca .p,.marca .oa,.marca .sp{color:var(--txt)}
  .marca .oa,.marca .sp{display:inline-block;overflow:hidden;white-space:pre;vertical-align:bottom;
    transition:max-width .6s cubic-bezier(.4,0,.2,1),opacity .45s ease,transform .55s ease}
  .marca .oa{max-width:var(--wa,1ch)}
  .marca .sp{max-width:var(--wsp,.35ch)}
  .marca .w2{display:inline-block;color:var(--txt);transition:color .6s ease}
  .marca.on .oa{max-width:0;opacity:0;transform:translateX(.14em)}
  .marca.on .sp{max-width:0}
  .marca.on .w2{color:var(--accent)}
  .marca.on:hover .oa{max-width:var(--wa);opacity:1;transform:none}
  .marca.on:hover .sp{max-width:var(--wsp)}
  .marca.on:hover .w2{color:var(--txt)}
  @media(prefers-reduced-motion:reduce){.marca .oa,.marca .sp,.marca .w2{transition:none}}
</style>
</head>
<body>
<nav id="navbar">
  <a class="wordmark" href="https://victorelvira.github.io">Víctor&nbsp;Elvira</a>
  <span class="nav-sep">·</span>
  <a class="nav-home" href="https://victorelvira.github.io/personal_projects.html">other interactive projects</a>
</nav>

<div id="app">
  <header>
    <h1><img class="emblem" src="favicon.svg" alt=""><span class="marca"><span class="p">Oper</span><span class="oa">a</span><span class="sp"> </span><span class="w2">Atlas</span></span></h1>
  <nav>
      <a href="nucleo.html">Operas</a>
      <a href="empezar.html">Start here</a>
      <a href="jugar.html">Play</a>
      <a href="compositores.html">Composers</a>
      <a href="personajes.html">Characters</a>
      <span class="nav-div"></span>
      <a href="conexiones.html" class="lens">Connections</a>
      <a href="timeline.html" class="lens">Timeline</a>
      <a href="analisis.html" class="lens">Trends</a>
      <a href="pulso.html" class="lens">Pulse</a>
      <a href="duraciones.html" class="lens">Durations</a>
      <a href="mapa.html" class="lens on">Map</a>
    </nav>
    <span class="count" id="count">loading…</span>
  </header>
  <aside>
    <div class="fld">
      <label>Search (title or composer)</label>
      <input type="text" id="q" placeholder="Verdi, Carmen, Wagner…" autocomplete="off">
    </div>
    <div class="fld">
      <label>Years (premiere / composition)</label>
      <div class="years">
        <span class="yrlab" id="ymin">—</span>
        <input type="range" id="ra" min="1590" max="2026" value="1590">
      </div>
      <div class="years">
        <input type="range" id="rb" min="1590" max="2026" value="2026">
        <span class="yrlab" id="ymax">—</span>
      </div>
    </div>
    <div class="fld">
      <label>Language</label>
      <select id="lang"><option value="">— all —</option></select>
    </div>
    <div class="fld">
      <label>Country of origin</label>
      <select id="country"><option value="">— all —</option></select>
    </div>
    <div class="fld">
      <label class="chk"><input type="checkbox" id="onlymap"> Only with a map location</label>
    </div>
    <div class="fld">
      <button class="btn" id="reset">Clear filters</button>
    </div>
    <div id="list"></div>
  </aside>
  <main>
    <div id="map"></div>
    <div id="timeline"><svg id="tl"></svg></div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script>
let DATA=[], F={q:"",a:1590,b:2026,lang:"",country:"",onlymap:false};
const $=s=>document.querySelector(s);

const map=L.map('map',{worldCopyJump:true}).setView([46,10],4);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
  attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19,subdomains:'abcd'}).addTo(map);
const cluster=L.markerClusterGroup({chunkedLoading:true,maxClusterRadius:45});
map.addLayer(cluster);

function match(o){
  if(F.q){const q=F.q.toLowerCase();
    const hay=o.t.toLowerCase().includes(q)||o.c.some(c=>c.toLowerCase().includes(q));
    if(!hay)return false;}
  if(o.y!=null){if(o.y<F.a||o.y>F.b)return false;}
  else if(F.a>1590||F.b<2026) return false; // si filtras por año, exige año
  if(F.lang && !o.lang.includes(F.lang))return false;
  if(F.country && o.country!==F.country)return false;
  if(F.onlymap && !o.ll)return false;
  return true;
}

function render(){
  const sel=DATA.filter(match);
  $('#count').textContent=sel.length.toLocaleString('es')+' operas'+
    (sel.length<DATA.length?` (de ${DATA.length.toLocaleString('es')})`:'');
  // mapa
  cluster.clearLayers();
  const ms=[];
  for(const o of sel){ if(!o.ll)continue;
    const m=L.marker(o.ll);
    m.bindPopup(`<b>${esc(o.t)}</b>${o.y?` (${o.y})`:''}<br>`+
      `${o.c.join(', ')||'—'}<br>`+
      `<span style="color:#a99b87">${esc(o.v||'')}</span>`);
    ms.push(m);
  }
  cluster.addLayers(ms);
  // lista (primeras 300)
  const L2=$('#list');L2.innerHTML='';
  for(const o of sel.slice(0,300)){
    const d=document.createElement('div');d.className='row';
    d.innerHTML=`<b>${esc(o.t)}</b> <span class="meta">${o.y||'s/f'}</span><br>`+
      `<span class="meta">${esc(o.c.join(', ')||'—')}${o.v?' · '+esc(o.v):''}</span>`;
    if(o.ll)d.onclick=()=>{map.setView(o.ll,12);};
    L2.appendChild(d);
  }
  timeline(sel);
}

function timeline(sel){
  const svg=$('#tl');const W=svg.clientWidth,H=svg.clientHeight;
  const D0=1600,D1=2030,step=10,n=(D1-D0)/step;
  const bins=new Array(n).fill(0);
  for(const o of sel){if(o.y==null)continue;const i=Math.floor((o.y-D0)/step);if(i>=0&&i<n)bins[i]++;}
  const mx=Math.max(1,...bins);const bw=W/n;
  let h='';
  for(let i=0;i<n;i++){const bh=(bins[i]/mx)*(H-18);
    h+=`<rect class="bar" x="${i*bw}" y="${H-18-bh}" width="${Math.max(bw-1,0.5)}" height="${Math.max(bh,0)}">`+
       `<title>${D0+i*step}s: ${bins[i]}</title></rect>`;}
  for(let yr=1650;yr<=2000;yr+=50){const x=((yr-D0)/(D1-D0))*W;
    h+=`<text class="axis" x="${x}" y="${H-4}" text-anchor="middle">${yr}</text>`;}
  svg.innerHTML=h;
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// controles
$('#q').oninput=e=>{F.q=e.target.value;render();};
function yr(){F.a=+$('#ra').value;F.b=+$('#rb').value;
  if(F.a>F.b){[F.a,F.b]=[F.b,F.a];}
  $('#ymin').textContent=F.a;$('#ymax').textContent=F.b;render();}
$('#ra').oninput=yr;$('#rb').oninput=yr;
$('#lang').onchange=e=>{F.lang=e.target.value;render();};
$('#country').onchange=e=>{F.country=e.target.value;render();};
$('#onlymap').onchange=e=>{F.onlymap=e.target.checked;render();};
$('#reset').onclick=()=>{F={q:"",a:1590,b:2026,lang:"",country:"",onlymap:false};
  $('#q').value='';$('#ra').value=1590;$('#rb').value=2026;$('#lang').value='';
  $('#country').value='';$('#onlymap').checked=false;$('#ymin').textContent=1590;$('#ymax').textContent=2026;render();};

fetch('operas.json').then(r=>r.json()).then(d=>{
  DATA=d;
  // rellenar selects
  const langs={},countries={};
  for(const o of d){o.lang.forEach(l=>langs[l]=(langs[l]||0)+1);
    if(o.country)countries[o.country]=(countries[o.country]||0)+1;}
  const top=obj=>Object.entries(obj).sort((a,b)=>b[1]-a[1]);
  for(const[l,c]of top(langs))$('#lang').insertAdjacentHTML('beforeend',`<option value="${esc(l)}">${esc(l)} (${c})</option>`);
  for(const[c,n]of top(countries))$('#country').insertAdjacentHTML('beforeend',`<option value="${esc(c)}">${esc(c)} (${n})</option>`);
  $('#ymin').textContent=1590;$('#ymax').textContent=2026;
  render();
}).catch(e=>{$('#count').textContent='Error loading operas.json — is a local server running? '+e;});
</script>
<script>/*brand-home*/(document.querySelector(".brand")||document.querySelector("header h1"))&&(document.querySelector(".brand")||document.querySelector("header h1")).addEventListener("click",()=>location.href="index.html");</script>
<script>/* master-logo-js */(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function initAll(){document.querySelectorAll('.marca').forEach(function(m){
    if(m.dataset.mi) return; m.dataset.mi='1';
    var oa=m.querySelector('.oa'), sp=m.querySelector('.sp'); if(!oa||!sp) return;
    var measure=function(){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');};
    measure(); addEventListener('resize',measure);
    if(reduce){m.classList.add('on');}
    else{requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(function(){m.classList.add('on');},650);});});}
  });}
  initAll(); if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){
    document.querySelectorAll('.marca').forEach(function(m){var oa=m.querySelector('.oa'),sp=m.querySelector('.sp');if(oa&&sp){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');}});});}
})();</script>
</body>
</html>
