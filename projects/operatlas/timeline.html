<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operatlas · timeline</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#faf6ec;--panel:#fffdf8;--panel2:#f1eadb;--line:#e7decb;--txt:#2b2620;--dim:#867a64;--accent:#9d2933;
    --baroque:#cbb488;--classic:#8aa6bf;--romantic:#c9ad74;--modern:#c98b86;--contemp:#9cbf94}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  #app{display:flex;flex-direction:column;flex:1;min-height:0}
  header{display:flex;align-items:center;gap:20px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
  .brand{font-size:19px;font-weight:600;letter-spacing:.4px}.brand span{color:var(--accent)}
  nav{display:flex;gap:4px;flex-wrap:wrap}
  nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:5px 11px;border-radius:6px}
  nav a:hover{background:var(--panel2);color:var(--txt)} nav a.on{color:var(--accent);background:var(--panel2)}
  .tools{margin-left:auto;display:flex;gap:10px;align-items:center}
  input,select{padding:7px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--txt);font-size:13px}
  .axis{position:sticky;top:0;z-index:3;background:var(--panel);border-bottom:1px solid var(--line)}
  #scroll{overflow:auto;flex:1}
  .lane{display:flex;align-items:center;height:30px;border-bottom:1px solid #20242766}
  .lane:hover{background:#ffffff06}
  .name{width:190px;min-width:190px;padding:0 12px;text-align:right;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
  .name:hover{color:var(--accent)}
  .name .n{color:var(--dim);font-weight:400;font-size:11px}
  .track{position:relative;flex:1;height:100%}
  .track .life{position:absolute;top:50%;height:2px;background:#352c24;transform:translateY(-50%)}
  .dot{position:absolute;top:50%;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;border:1px solid #14100e}
  .dot:hover{outline:2px solid var(--txt)}
  .axline{position:absolute;top:0;bottom:0;width:1px;background:#20242766}
  .axlab{position:absolute;top:6px;font-size:11px;color:var(--dim);transform:translateX(-50%)}
  #tip{position:fixed;pointer-events:none;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;display:none;z-index:20;max-width:220px}
  #tip b{color:var(--accent)}
  .leg{padding:7px 22px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line);background:var(--panel);display:flex;gap:16px;flex-wrap:wrap}
  .leg .d{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}

  /* barra de identidad compartida (misma en todos los proyectos) */
  body{display:flex;flex-direction:column;min-height:100vh}
  #navbar{display:flex;align-items:center;gap:7px;padding:5px 16px;background:#f1eadb;font-size:12.5px;flex:0 0 auto}
  #navbar .wordmark{color:#2b2620;font-weight:700;text-decoration:none;letter-spacing:.2px}
  #navbar .nav-sep{color:#b3a68d}
  #navbar .nav-home{color:#d8cbb2;text-decoration:none}
  #navbar a:hover{text-decoration:underline}
  .emblem{width:17px;height:17px;vertical-align:-3px;margin-right:6px}
  .brand,header h1{cursor:pointer}

  /* nav-tiers */
  nav .nav-div{display:inline-block;width:1px;height:16px;background:var(--line);margin:0 8px;vertical-align:middle}
  nav a.lens{font-size:12px;color:#948873}
  nav a.lens:hover{color:var(--txt);background:var(--panel2)}
  nav a.lens.on{color:var(--accent)}

  /* elegant-type */
  body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  h1,h2,h3,.brand,.fh1,.hero h1,.marca{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif !important;font-weight:600;letter-spacing:.01em}
  .brand{font-size:22px;letter-spacing:.02em}
  .fh1,.hero h1{font-weight:600;letter-spacing:.008em}
  h2{font-weight:600}

  /* master-logo */
  .marca{cursor:pointer;white-space:nowrap}
  .marca .p,.marca .oa,.marca .sp{color:var(--txt)}
  .marca .oa,.marca .sp{display:inline-block;overflow:hidden;white-space:pre;vertical-align:bottom;
    transition:max-width .6s cubic-bezier(.4,0,.2,1),opacity .45s ease,transform .55s ease}
  .marca .oa{max-width:var(--wa,1ch)}
  .marca .sp{max-width:var(--wsp,.35ch)}
  .marca .w2{display:inline-block;color:var(--txt);transition:color .6s ease}
  .marca.on .oa{max-width:0;opacity:0;transform:translateX(.14em)}
  .marca.on .sp{max-width:0}
  .marca.on .w2{color:var(--accent)}
  .marca.on:hover .oa{max-width:var(--wa);opacity:1;transform:none}
  .marca.on:hover .sp{max-width:var(--wsp)}
  .marca.on:hover .w2{color:var(--txt)}
  @media(prefers-reduced-motion:reduce){.marca .oa,.marca .sp,.marca .w2{transition:none}}
</style>
</head>
<body>
<nav id="navbar">
  <a class="wordmark" href="https://victorelvira.github.io">Víctor&nbsp;Elvira</a>
  <span class="nav-sep">·</span>
  <a class="nav-home" href="https://victorelvira.github.io/personal_projects.html">other interactive projects</a>
</nav>

<div id="app">
  <header>
    <span class="brand"><img class="emblem" src="favicon.svg" alt=""><span class="marca"><span class="p">Oper</span><span class="oa">a</span><span class="sp"> </span><span class="w2">Atlas</span></span></span>
    <nav>
      <a href="nucleo.html">Operas</a>
      <a href="empezar.html">Start here</a>
      <a href="jugar.html">Play</a>
      <a href="compositores.html">Composers</a>
      <a href="personajes.html">Characters</a>
      <span class="nav-div"></span>
      <a href="conexiones.html" class="lens">Connections</a>
      <a href="timeline.html" class="lens on">Timeline</a>
      <a href="analisis.html" class="lens">Trends</a>
      <a href="pulso.html" class="lens">Pulse</a>
      <a href="duraciones.html" class="lens">Durations</a>
      <a href="mapa.html" class="lens">Map</a>
    </nav>
    <div class="tools">
      <input id="q" type="text" placeholder="filter composer…" autocomplete="off">
    </div>
  </header>
  <div class="axis"><div class="lane" style="height:26px;border:0"><div class="name" style="color:#867a67;font-weight:400">composer ↓ / year →</div><div class="track" id="axis"></div></div></div>
  <div id="scroll"><div id="lanes"></div></div>
  <div class="leg" id="leg"></div>
</div>
<div id="tip"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const Y0=1590,Y1=2030;
const eraCol=y=> y<1750?'--baroque': y<1830?'--classic': y<1900?'--romantic': y<1955?'--modern':'--contemp';
const x=y=>((y-Y0)/(Y1-Y0))*100;
let DATA=[], COMPS=[], MAXP=1;

function drawAxis(){
  let h='';
  for(let yr=1600;yr<=2000;yr+=50){h+=`<div class="axline" style="left:${x(yr)}%"></div><div class="axlab" style="left:${x(yr)}%">${yr}</div>`;}
  $('#axis').innerHTML=h;
}
function build(){
  const byc={};
  // SOLO años limpios de Wikidata (ob_premiere está sucio: fechas de producción recientes)
  DATA.forEach(o=>{if(o.wd_year){ (byc[o.composer]=byc[o.composer]||[]).push(o); }});
  COMPS=Object.entries(byc).map(([name,ops])=>{
    const ys=ops.map(o=>o.wd_year).sort((a,b)=>a-b);
    const med=ys[Math.floor(ys.length/2)];
    return {name, ops, min:Math.min(...ys), max:Math.max(...ys), med, n:ops.length};
  }).sort((a,b)=>a.med-b.med);  // ordenar por mediana (robusto a años atípicos)
}
function draw(){
  const q=$('#q').value.toLowerCase().trim();
  const list=COMPS.filter(c=>!q||c.name.toLowerCase().includes(q));
  $('#lanes').innerHTML=list.map(c=>{
    const life=`<div class="life" style="left:${x(c.min)}%;width:${x(c.max)-x(c.min)}%"></div>`;
    const dots=c.ops.map(o=>{
      const r=3+7*Math.sqrt((o.perfs||1)/MAXP);
      return `<div class="dot" style="left:${x(o.wd_year)}%;width:${r*2}px;height:${r*2}px;background:var(${eraCol(o.wd_year)})"
        data-t="${esc(o.title)}" data-c="${esc(o.composer)}" data-y="${o.wd_year}"></div>`;
    }).join('');
    return `<div class="lane"><div class="name" data-comp="${esc(c.name)}">${esc(c.name)} <span class="n">${c.n}</span></div>
      <div class="track">${life}${dots}</div></div>`;
  }).join('');
  bind();
}
function bind(){
  const tip=$('#tip');
  $('#lanes').querySelectorAll('.dot').forEach(d=>{
    d.onmousemove=e=>{tip.style.display='block';tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';
      tip.innerHTML=`<b>${d.dataset.t}</b><br>${d.dataset.c} · ${d.dataset.y}`;};
    d.onmouseleave=()=>tip.style.display='none';
    d.onclick=()=>location.href='nucleo.html?opera='+encodeURIComponent(d.dataset.t);
  });
  $('#lanes').querySelectorAll('.name').forEach(n=>n.onclick=()=>location.href='compositores.html');
}
$('#q').oninput=draw;
$('#leg').innerHTML=[['--baroque','Baroque (–1750)'],['--classic','Classical (1750–1830)'],['--romantic','Romantic (1830–1900)'],['--modern','Modern (1900–1955)'],['--contemp','Contemporary (1955–)']]
  .map(([c,l])=>`<span><span class="d" style="background:var(${c})"></span>${l}</span>`).join('')+' · size = repertory · only operas with a year';

fetch('core.json').then(r=>r.json()).then(d=>{DATA=d;MAXP=Math.max(...d.map(o=>o.perfs||1));drawAxis();build();draw();})
 .catch(e=>{$('#lanes').innerHTML='Error: '+e;});
addEventListener('resize',drawAxis);
</script>
<script>/*brand-home*/(document.querySelector(".brand")||document.querySelector("header h1"))&&(document.querySelector(".brand")||document.querySelector("header h1")).addEventListener("click",()=>location.href="index.html");</script>
<script>/* master-logo-js */(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  function initAll(){document.querySelectorAll('.marca').forEach(function(m){
    if(m.dataset.mi) return; m.dataset.mi='1';
    var oa=m.querySelector('.oa'), sp=m.querySelector('.sp'); if(!oa||!sp) return;
    var measure=function(){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');};
    measure(); addEventListener('resize',measure);
    if(reduce){m.classList.add('on');}
    else{requestAnimationFrame(function(){requestAnimationFrame(function(){setTimeout(function(){m.classList.add('on');},650);});});}
  });}
  initAll(); if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){
    document.querySelectorAll('.marca').forEach(function(m){var oa=m.querySelector('.oa'),sp=m.querySelector('.sp');if(oa&&sp){m.style.setProperty('--wa',oa.scrollWidth+'px');m.style.setProperty('--wsp',sp.scrollWidth+'px');}});});}
})();</script>
</body>
</html>
