<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Patronos de España · el santo de cada pueblo</title>
  <link rel="icon" href="patronos/favicon.svg">
  <meta name="description" content="El patrón y la patrona de cada municipio de España y de Italia, con la fuente de cada dato y los pueblos de los que aún no se sabe.">
  <meta name="author" content="Víctor Elvira">
  <meta name="theme-color" content="#2a1d2b">
  <link rel="stylesheet" href="patronos/vendor/leaflet.css">
  <link rel="stylesheet" href="patronos/style.css?v=0.10.0">
</head>
<body>
  <nav id="navbar">
    <a class="wordmark" href="https://victorelvira.github.io">Víctor&nbsp;Elvira</a>
    <span class="nav-sep">·</span>
    <a class="nav-home" href="https://victorelvira.github.io/personal_projects.html">other interactive projects</a>
    <span id="build" class="build" title="Versión y última actualización"></span>
  </nav>

  <header id="bar">
    <a class="brand" href="patronos.html" title="Recargar (quita la selección)">
      <img class="mark" src="patronos/favicon.svg" width="28" height="28" alt="">
      <div>
        <strong>Patronos de España</strong>
        <small>el santo de cada pueblo, y quién lo dice</small>
      </div>
    </a>
    <nav class="country" aria-label="País">
      <button type="button" class="cty on" data-c="es">España</button><button type="button" class="cty" data-c="it">Italia</button>
    </nav>
    <div id="stats" class="stats">cargando…</div>
  </header>

  <div id="controls">
    <span class="tabs" role="tablist">
      <button type="button" class="tab active" data-view="main" title="Cada pueblo con el color de su primer patrón">Primer patrón</button>
      <button type="button" class="tab" data-view="group" title="Virgen María, Cristo o un santo">María · Cristo · santos</button>
      <button type="button" class="tab" data-view="agree" title="¿Coinciden Wikipedia y Wikidata?">Fuentes</button>
      <button type="button" class="tab" data-view="cal" title="Qué pueblos celebran a su patrón cada día">Calendario</button>
    </span>
    <span class="search-wrap">
      <input id="town-q" type="search" placeholder="Buscar pueblo…" autocomplete="off" aria-label="Buscar pueblo">
      <div id="town-hits" class="hits" hidden></div>
    </span>
    <button type="button" id="churches-btn" class="chip" aria-pressed="false" title="Iglesias e imágenes de santos (Wikidata y OpenStreetMap), al acercarse">⛪ iglesias e imágenes</button>
    <button type="button" id="nodata" class="chip" aria-pressed="false" title="Resaltar los pueblos de los que aún no hay dato">∅ sin dato</button>
  </div>
  <div id="explain" class="explain"></div>

  <main id="main">
    <div id="map"></div>
    <div id="drag" title="Arrastra para cambiar el ancho"></div>
    <aside id="panel"></aside>
  </main>

  <div id="card" hidden role="dialog" aria-modal="true" aria-label="Ficha del pueblo">
    <div class="c-card"><button id="card-close" type="button" aria-label="Cerrar">✕</button><div id="card-body"></div></div>
  </div>
  <div id="tip" class="tip" hidden></div>

  <script src="patronos/vendor/leaflet.js"></script>
  <script src="patronos/app.js?v=0.10.0"></script>
</body>
</html>
